name: "Gateway & FileSync Tests"
on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Run Gateway Range Seeking Test
        run: |
          go test -v ./pkg/lib/gateway -run TestGetFile_RangeSeeking
